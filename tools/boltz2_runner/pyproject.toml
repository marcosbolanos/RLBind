[project]
name = "boltz2-runner"
version = "0.1.0"
description = "Minimal runner for Rowan MSA + Boltz prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0.0",
  "python-dotenv>=1.0.0",
  "stjames",
  # Provides the `boltz` CLI used by this runner.
  "boltz",
  "pyright>=1.1.408",
  "rowan-python>=2.1.15",
]
